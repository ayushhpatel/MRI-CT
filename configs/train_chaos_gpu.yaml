# CORRECTED High-Quality CycleGAN Configuration
data:
  mri_dir: "data/chaos_small/mri"
  ct_dir: "data/chaos_small/ct" 
  num_workers: 2
  resolution: 256
  augment: true

model:
  n_res_blocks: 9
  norm: "instance"
  pad_type: "reflect"
  use_dropout: false
  init_type: "normal"
  init_gain: 0.02
  lsgan: true

train:
  epochs: 20
  batch_size: 2
  lr: 0.0002
  lr_policy: "linear"
  lr_decay_start: 10
  lambda_cycle: 10
  lambda_identity: 1
  mixed_precision: true
  force_cpu: false
  log_every: 40
  sample_every: 200
  save_every_steps: 2000
  save_dir: "runs/hd_fast"
