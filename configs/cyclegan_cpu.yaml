data:
  mri_dir: data/processed/mri
  ct_dir: data/processed/ct
  num_workers: 0

model:
  n_res_blocks: 4  # smaller for CPU runs

train:
  epochs: 2
  batch_size: 2
  lr: 0.0002
  lambda_cycle: 10.0
  lambda_identity: 5.0
  lsgan: true
  log_every: 10
  sample_every: 50
  save_dir: runs/cyclegan_cpu
  save_every_steps: 50
  resume_checkpoint: runs/cyclegan_cpu/checkpoints/step_000100.pt
  force_cpu: true
