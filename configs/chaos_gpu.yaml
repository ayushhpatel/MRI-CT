data:
  mri_dir: "data/chaos/mri_slices"
  ct_dir: "data/chaos/ct_slices"
  num_workers: 4

model:
  n_res_blocks: 9   # use 9 for 256px – important

train:
  epochs: 80        # 40 will undertrain
  batch_size: 12
  lr: 0.0002
  lambda_cycle: 10.0
  lambda_identity: 5.0
  lsgan: true
  force_cpu: false
  log_every: 50
  sample_every: 200
  save_every_steps: 500
  save_dir: "runs/chaos_train"
  resume_checkpoint: null   # leave null for now
